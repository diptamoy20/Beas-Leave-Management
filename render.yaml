services:
  - type: web
    name: beas-leave-management
    env: node
    # Single npm install at root installs all workspaces, then build client
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
